media:
  input: public/assets
  output: /assets
  rename: safe
  categories: [image]

content:
  - name: home
    label: Page d'accueil
    type: file
    path: src/content/home.json
    format: json
    operations:
      create: false
      rename: false
      delete: false
    fields:
      - name: seo
        label: Référencement
        type: object
        fields:
          - { name: title, label: Titre SEO, type: string, required: true }
          - { name: description, label: Description SEO, type: text, required: true }
      - name: hero
        label: En-tête principal
        type: object
        fields:
          - { name: eyebrow, label: Surtitre, type: string }
          - { name: title, label: Titre, type: string, required: true }
          - { name: text, label: Introduction, type: text, required: true }
          - { name: image, label: Image, type: image, required: true }
          - { name: imageAlt, label: Texte alternatif de l'image, type: string, required: true }
          - { name: badgeNumber, label: Numéro du médaillon, type: string }
          - { name: badgeLabel, label: Texte du médaillon, type: string }
          - name: primaryAction
            label: Bouton principal
            type: object
            fields:
              - { name: label, label: Libellé, type: string }
              - { name: url, label: URL, type: string }
          - name: secondaryAction
            label: Bouton secondaire
            type: object
            fields:
              - { name: label, label: Libellé, type: string }
              - { name: url, label: URL, type: string }
      - name: quickAccess
        label: Accès rapides
        type: object
        fields:
          - { name: eyebrow, label: Surtitre, type: string }
          - { name: title, label: Titre, type: string }
          - { name: intro, label: Introduction, type: text }
          - name: items
            label: Cartes
            type: object
            list:
              collapsible:
                collapsed: true
                summary: "{title}"
            fields:
              - { name: title, label: Titre, type: string }
              - { name: text, label: Texte, type: text }
              - { name: url, label: URL, type: string }
              - name: icon
                label: Icône
                type: select
                options:
                  values:
                    - { value: permit, label: Permis }
                    - { value: member, label: Adhérent }
                    - { value: learn, label: Apprentissage }
                    - { value: training, label: Formation }
      - name: missions
        label: Missions
        type: object
        fields:
          - { name: eyebrow, label: Surtitre, type: string }
          - { name: title, label: Titre, type: string }
          - { name: intro, label: Introduction, type: text }
          - name: items
            label: Liste des missions
            type: object
            list:
              collapsible:
                collapsed: true
                summary: "{number} — {title}"
            fields:
              - { name: number, label: Numéro, type: string }
              - { name: title, label: Titre, type: string }
              - { name: text, label: Texte, type: text }
      - name: information
        label: Bloc d'information
        type: object
        fields:
          - { name: eyebrow, label: Surtitre, type: string }
          - { name: title, label: Titre, type: string }
          - { name: visualLabel, label: Texte du visuel, type: string }
          - { name: text, label: Texte, type: text }
          - name: link
            label: Lien
            type: object
            fields:
              - { name: label, label: Libellé, type: string }
              - { name: url, label: URL, type: string }
      - name: contactCallout
        label: Appel au contact
        type: object
        fields:
          - { name: eyebrow, label: Surtitre, type: string }
          - { name: title, label: Titre, type: string }
          - { name: text, label: Texte, type: text }
          - { name: actionLabel, label: Libellé du bouton, type: string }
          - { name: actionUrl, label: URL du bouton, type: string }

  - name: pages
    label: Pages secondaires
    type: collection
    path: src/content/pages
    format: yaml-frontmatter
    subfolders: false
    filename:
      template: "{primary}.md"
      field: true
    view:
      primary: title
      fields: [title, showInNavigation, navigationOrder]
      sort: navigationOrder
      order: asc
    operations:
      create: true
      rename: true
      delete: true
    fields:
      - name: title
        label: Titre de la page
        type: string
        required: true
        description: Sert aussi à proposer le nom de fichier et l'URL lors de la création.
      - name: description
        label: Description SEO
        type: text
        required: true
        description: Résumé affiché par les moteurs de recherche.
      - { name: eyebrow, label: Surtitre, type: string }
      - name: intro
        label: Introduction
        type: text
        required: true
      - name: showInNavigation
        label: Afficher dans le menu
        type: boolean
        default: true
      - name: navigationLabel
        label: Libellé dans le menu
        type: string
        description: Laisser vide pour reprendre le titre de la page.
      - name: navigationOrder
        label: Ordre dans le menu
        type: number
        default: 100
        options:
          min: 1
          max: 999
      - name: body
        label: Contenu principal
        type: rich-text
        required: true
        options:
          format: markdown
          switcher: false
          media: false
      - name: cards
        label: Cartes pratiques (facultatif)
        type: object
        list:
          collapsible:
            collapsed: true
            summary: "{label} — {title}"
        fields:
          - name: icon
            label: Icône
            type: select
            options:
              values:
                - { value: pin, label: Adresse }
                - { value: phone, label: Téléphone }
                - { value: mail, label: Courriel }
                - { value: learn, label: Information }
                - { value: training, label: Formation }
          - { name: label, label: Surtitre, type: string }
          - { name: title, label: Titre, type: string }
          - { name: lines, label: Lignes de détail, type: string, list: true }
          - name: link
            label: Lien facultatif
            type: object
            fields:
              - { name: label, label: Libellé, type: string }
              - { name: url, label: URL, type: string }
      - name: schedule
        label: Bloc horaires (facultatif)
        type: object
        fields:
          - { name: eyebrow, label: Surtitre, type: string }
          - { name: title, label: Titre, type: string }
          - name: rows
            label: Lignes
            type: object
            list:
              collapsible:
                collapsed: true
                summary: "{label}"
            fields:
              - { name: label, label: Jours ou libellé, type: string }
              - { name: value, label: Horaires ou valeur, type: string }
          - { name: note, label: Note, type: text }
      - name: callout
        label: Appel à l'action (facultatif)
        type: object
        fields:
          - { name: eyebrow, label: Surtitre, type: string }
          - { name: title, label: Titre, type: string }
          - { name: text, label: Texte, type: text }
          - name: action
            label: Bouton
            type: object
            fields:
              - { name: label, label: Libellé, type: string }
              - { name: url, label: URL, type: string }

  - name: site
    label: Paramètres du site
    type: file
    path: src/content/site.json
    format: json
    operations:
      create: false
      rename: false
      delete: false
    fields:
      - { name: name, label: Nom complet, type: string, required: true }
      - { name: shortName, label: Nom court, type: string, required: true }
      - { name: tagline, label: Signature, type: string }
      - { name: logo, label: Logo, type: image }
      - name: headerAction
        label: Bouton d'en-tête
        type: object
        fields:
          - { name: label, label: Libellé, type: string }
          - { name: url, label: URL, type: string }
      - { name: footerText, label: Texte du pied de page, type: string }
      - name: sourceSite
        label: Site actuel
        type: object
        fields:
          - { name: label, label: Libellé, type: string }
          - { name: url, label: URL, type: string }
      - name: socialLinks
        label: Réseaux sociaux
        type: object
        list:
          collapsible:
            collapsed: true
            summary: "{label}"
        fields:
          - { name: label, label: Nom, type: string }
          - { name: url, label: URL, type: string }
