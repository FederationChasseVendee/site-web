media:
  input: public/assets
  output: /assets

content:
  - name: site
    label: Paramètres du site
    type: file
    path: src/content/site.json
    format: json
    fields:
      - { name: name, label: Nom complet, type: string }
      - { name: shortName, label: Nom court, type: string }
      - { name: tagline, label: Signature, type: string }
      - { name: logo, label: Logo, type: image }
      - name: navigation
        label: Navigation
        type: object
        list: true
        fields:
          - { name: label, label: Libellé, type: string }
          - { name: url, label: URL relative, type: string }
      - name: headerAction
        label: Bouton d'en-tête
        type: object
        fields:
          - { name: label, label: Libellé, type: string }
          - { name: url, label: URL, type: string }
      - { name: footerText, label: Texte du pied de page, type: string }
      - name: sourceSite
        label: Site actuel
        type: object
        fields:
          - { name: label, label: Libellé, type: string }
          - { name: url, label: URL, type: string }
      - name: socialLinks
        label: Réseaux sociaux
        type: object
        list: true
        fields:
          - { name: label, label: Nom, type: string }
          - { name: url, label: URL, type: string }

  - name: home
    label: Page d'accueil
    type: file
    path: src/content/home.json
    format: json
    fields:
      - name: seo
        label: Référencement
        type: object
        fields:
          - { name: title, label: Titre SEO, type: string }
          - { name: description, label: Description SEO, type: text }
      - name: hero
        label: En-tête principal
        type: object
        fields:
          - { name: eyebrow, label: Surtitre, type: string }
          - { name: title, label: Titre, type: string }
          - { name: text, label: Introduction, type: text }
          - { name: image, label: Image, type: image }
          - { name: imageAlt, label: Texte alternatif de l'image, type: string }
          - { name: badgeNumber, label: Numéro du médaillon, type: string }
          - { name: badgeLabel, label: Texte du médaillon, type: string }
          - name: primaryAction
            label: Bouton principal
            type: object
            fields:
              - { name: label, label: Libellé, type: string }
              - { name: url, label: URL, type: string }
          - name: secondaryAction
            label: Bouton secondaire
            type: object
            fields:
              - { name: label, label: Libellé, type: string }
              - { name: url, label: URL, type: string }
      - name: quickAccess
        label: Accès rapides
        type: object
        fields:
          - { name: eyebrow, label: Surtitre, type: string }
          - { name: title, label: Titre, type: string }
          - { name: intro, label: Introduction, type: text }
          - name: items
            label: Cartes
            type: object
            list: true
            fields:
              - { name: title, label: Titre, type: string }
              - { name: text, label: Texte, type: text }
              - { name: url, label: URL, type: string }
              - name: icon
                label: Icône
                type: select
                options:
                  values:
                    - { value: permit, label: Permis }
                    - { value: member, label: Adhérent }
                    - { value: learn, label: Apprentissage }
                    - { value: training, label: Formation }
      - name: missions
        label: Missions
        type: object
        fields:
          - { name: eyebrow, label: Surtitre, type: string }
          - { name: title, label: Titre, type: string }
          - { name: intro, label: Introduction, type: text }
          - name: items
            label: Liste des missions
            type: object
            list: true
            fields:
              - { name: number, label: Numéro, type: string }
              - { name: title, label: Titre, type: string }
              - { name: text, label: Texte, type: text }
      - name: information
        label: Bloc d'information
        type: object
        fields:
          - { name: eyebrow, label: Surtitre, type: string }
          - { name: title, label: Titre, type: string }
          - { name: visualLabel, label: Texte du visuel, type: string }
          - { name: text, label: Texte, type: text }
          - name: link
            label: Lien
            type: object
            fields:
              - { name: label, label: Libellé, type: string }
              - { name: url, label: URL, type: string }
      - name: contactCallout
        label: Appel au contact
        type: object
        fields:
          - { name: eyebrow, label: Surtitre, type: string }
          - { name: title, label: Titre, type: string }
          - { name: text, label: Texte, type: text }
          - { name: actionLabel, label: Libellé du bouton, type: string }

  - name: contact
    label: Page contact
    type: file
    path: src/content/contact.json
    format: json
    fields:
      - name: seo
        label: Référencement
        type: object
        fields:
          - { name: title, label: Titre SEO, type: string }
          - { name: description, label: Description SEO, type: text }
      - name: header
        label: En-tête
        type: object
        fields:
          - { name: eyebrow, label: Surtitre, type: string }
          - { name: title, label: Titre, type: string }
          - { name: text, label: Introduction, type: text }
      - name: contact
        label: Coordonnées
        type: object
        fields:
          - { name: postalLabel, label: Libellé adresse, type: string }
          - { name: organization, label: Organisation, type: string }
          - { name: addressLines, label: Lignes d'adresse, type: string, list: true }
          - { name: phoneLabel, label: Libellé téléphone, type: string }
          - { name: phoneDisplay, label: Téléphone affiché, type: string }
          - { name: phoneUrl, label: Lien téléphone, type: string }
          - { name: emailLabel, label: Libellé courriel, type: string }
          - { name: email, label: Courriel affiché, type: string }
          - { name: emailUrl, label: Lien courriel, type: string }
          - { name: mapLabel, label: Libellé itinéraire, type: string }
          - { name: mapUrl, label: URL de la carte, type: string }
      - name: hours
        label: Horaires
        type: object
        fields:
          - { name: eyebrow, label: Surtitre, type: string }
          - { name: title, label: Titre, type: string }
          - name: rows
            label: Plages horaires
            type: object
            list: true
            fields:
              - { name: days, label: Jours, type: string }
              - { name: hours, label: Horaires, type: string }
          - { name: note, label: Note, type: text }
      - name: emailCallout
        label: Bloc courriel
        type: object
        fields:
          - { name: eyebrow, label: Surtitre, type: string }
          - { name: title, label: Titre, type: string }
          - { name: text, label: Explication, type: text }
          - { name: buttonLabel, label: Libellé du bouton, type: string }
