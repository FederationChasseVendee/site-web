name: PagesCMS Cloudflare preview

on:
  workflow_dispatch:
    inputs:
      payload:
        description: PagesCMS payload as JSON
        required: true
        type: string

permissions:
  contents: read
  pull-requests: write

jobs:
  publish-preview-link:
    name: Publish preview link
    runs-on: ubuntu-latest
    steps:
      - name: Calculate preview URL
        id: preview
        env:
          PAYLOAD: ${{ inputs.payload }}
        shell: bash
        run: |
          set -euo pipefail
          export LC_ALL=C

          branch="$(jq -er '.repository.ref | select(type == "string" and length > 0)' <<< "$PAYLOAD")"
          preview_alias="$(
            printf '%s' "$branch" |
              tr '[:upper:]' '[:lower:]' |
              sed -E 's/[^a-z0-9]/-/g; s/^-+//; s/-+$//' |
              cut -c1-28 |
              sed -E 's/-+$//'
          )"

          if [[ -z "$preview_alias" ]]; then
            echo "::error::The branch name cannot produce a valid Cloudflare Pages preview alias."
            exit 1
          fi

          preview_url="https://${preview_alias}.fdc85.pages.dev"
          echo "branch=$branch" >> "$GITHUB_OUTPUT"
          echo "url=$preview_url" >> "$GITHUB_OUTPUT"

          {
            echo "## Preview Cloudflare Pages"
            echo
            echo "- Branche : \`$branch\`"
            echo "- URL : [$preview_url]($preview_url)"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Publish link on an open pull request
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: ${{ steps.preview.outputs.branch }}
          PREVIEW_URL: ${{ steps.preview.outputs.url }}
        shell: bash
        run: |
          set -euo pipefail

          pr_number="$(
            gh pr list \
              --repo "$GITHUB_REPOSITORY" \
              --head "$BRANCH" \
              --state open \
              --json number \
              --jq '.[0].number // empty'
          )"

          if [[ -z "$pr_number" ]]; then
            echo "Aucune pull request ouverte trouvée pour la branche \`$BRANCH\`." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          marker="<!-- pages-cms-cloudflare-preview -->"
          body="$(cat <<EOF
          $marker
          ## Preview Cloudflare Pages

          [$PREVIEW_URL]($PREVIEW_URL)

          Branche : \`$BRANCH\`
          EOF
          )"
          comment_id="$(
            gh api --paginate "repos/$GITHUB_REPOSITORY/issues/$pr_number/comments" \
              --jq '.[] | select(.body | contains("<!-- pages-cms-cloudflare-preview -->")) | .id' |
              head -n 1
          )"

          if [[ -n "$comment_id" ]]; then
            gh api \
              --method PATCH \
              "repos/$GITHUB_REPOSITORY/issues/comments/$comment_id" \
              -f body="$body" >/dev/null
            action="mis à jour"
          else
            gh api \
              --method POST \
              "repos/$GITHUB_REPOSITORY/issues/$pr_number/comments" \
              -f body="$body" >/dev/null
            action="créé"
          fi

          echo "Commentaire de preview $action sur la pull request #$pr_number." >> "$GITHUB_STEP_SUMMARY"
